aid: dialect
name: Dialect
description: 'Dialect is a Web3 UX infrastructure company on Solana that provides onchain
  transactions and notifications native to any digital experience. Its two flagship products
  are Blinks (Blockchain Links — one-click, embeddable onchain transactions powered by a
  Standard Blinks Library of 40+ protocol integrations including Jupiter, Kamino, Drift and
  DeFiTuna) and the Alerts Stack (real-time, multi-channel notifications across push, email,
  Telegram and an in-app universal inbox, with event detection for price-change and
  trending-token signals). Dialect also exposes a Markets & Positions API for real-time DeFi
  rates, TVL and wallet position tracking, plus a hosted MCP server for agents. The developer
  surface spans three REST APIs (Alerts V2, Blinks, Markets), TypeScript/React SDKs, a
  no-code dashboard, and an open-source monitor framework. Backed by Electric Capital and
  Multicoin Capital.'
